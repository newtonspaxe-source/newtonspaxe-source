<text x="24" y="158" fill="#748491" font-family="monospace" font-size="12">system.state = "learning"</text>
<text x="24" y="180" fill="#748491" font-family="monospace" font-size="12">system.mode  = "agentic"</text>
<text x="24" y="202" fill="#748491" font-family="monospace" font-size="12">system.guard = "deterministic"</text>
