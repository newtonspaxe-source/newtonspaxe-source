<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Atharva Pandey — AI/ML engineer</title>
  <desc id="desc">Animated dark AI engineering inspired hero with neural waves and subtle grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="52%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#120a21"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="34%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="68%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.02"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1600" height="420" rx="32" fill="url(#bg)"/>
  <rect width="1600" height="420" rx="32" fill="url(#grid)"/>

  <g opacity="0.55" filter="url(#glow)">
    <circle cx="1260" cy="88" r="2.4" fill="#67e8f9">
      <animate attributeName="cy" values="88;76;88" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1310" cy="150" r="1.8" fill="#a78bfa">
      <animate attributeName="cx" values="1310;1290;1310" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1190" cy="122" r="1.7" fill="#f0abfc">
      <animate attributeName="cy" values="122;138;122" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1420" cy="116" r="1.6" fill="#7dd3fc">
      <animate attributeName="cy" values="116;104;116" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M-20 286 C 120 182, 210 392, 360 286 S 610 180, 760 286 S 1010 392, 1160 286 S 1410 180, 1620 286" stroke="url(#wave1)" stroke-width="2.6" stroke-dasharray="10 11">
      <animate attributeName="stroke-dashoffset" from="0" to="-210" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M-40 334 C 140 240, 240 420, 420 334 S 720 240, 900 334 S 1200 420, 1380 334 S 1580 240, 1700 334" stroke="url(#wave2)" stroke-width="1.5" stroke-dasharray="5 13">
      <animate attributeName="stroke-dashoffset" from="0" to="-180" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-30 248 C 120 168, 260 350, 410 248 S 700 168, 850 248 S 1140 350, 1290 248 S 1510 168, 1640 248" stroke="#67e8f9" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="100" y="98" fill="#94a3b8" font-size="16" letter-spacing="6">AI / ML · NLP · AGENTIC SYSTEMS</text>
    <text x="96" y="176" fill="#f8fafc" font-size="66" font-weight="700" letter-spacing="-2">ATHARVA PANDEY</text>
    <text x="100" y="220" fill="#cbd5e1" font-size="22">building intelligent systems from foundations to agents</text>
    <text x="100" y="276" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">f(data, models, memory, tools, constraints) → reliable systems</text>
  </g>

  <g transform="translate(1328 60)">
    <rect width="168" height="42" rx="21" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="22" cy="21" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="37" y="27" fill="#cbd5e1" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">BUILDING / ACTIVE</text>
  </g>
</svg>
