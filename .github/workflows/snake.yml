name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: newtonspaxe-source
          outputs: |
            dist/github-snake.svg?color_snake=%2367e8f9&color_dots=%230f172a%231e293b%23334155%2338bdf8%238b5cf6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2367e8f9
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
